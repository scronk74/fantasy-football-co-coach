[project]
name = "ffcoach"
version = "0.1.0"
description = "Fantasy football co-coach"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.scripts]
ffcoach = "ffcoach.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffcoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
